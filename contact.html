<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お問い合わせ | Shijun Studio</title>
<meta name="description" content="ドット絵、ゲームUI、2Dイラスト、小さな2D実装のご依頼・ご相談はこちらから。">
<style>
  :root {
    --fg: #1a1a1a;
    --muted: #6b6b6b;
    --bg: #ffffff;
    --line: #e6e6e6;
    --accent: #1a6b4f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--fg);
    background: var(--bg);
    font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.8;
  }
  main { max-width: 720px; margin: 0 auto; padding: 48px 20px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 8px; }
  .lead { color: var(--muted); margin: 0 0 32px; }
  .form iframe {
    width: 100%;
    min-height: 900px;
    border: 0;
    background: #fafafa;
  }
  .alt {
    margin-top: 32px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 0.9rem;
  }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>お問い合わせ</h1>
  <p class="lead">ゲームの概要、必要な成果物、使用エンジン、希望時期、予算の目安をお知らせください。未定の項目は「未定」とお書きください。参考URLは任意です。通常、2営業日以内を目安に返信します。</p>

  <div class="form">
    <!-- Googleフォーム（埋め込み） -->
    <iframe
      src="https://docs.google.com/forms/d/e/1FAIpQLSexQn_ZmD5GPR0hL90gEteQCkf09zXFrJ8lDK-hlhJgR3OjbA/viewform?embedded=true"
      title="お問い合わせフォーム"
      loading="lazy">読み込んでいます…</iframe>
  </div>

  <p class="alt">
    フォームが開かない場合は
    <a href="https://docs.google.com/forms/d/e/1FAIpQLSexQn_ZmD5GPR0hL90gEteQCkf09zXFrJ8lDK-hlhJgR3OjbA/viewform" target="_blank" rel="noopener">こちらのページから直接開けます</a>。<br>
    お預かりした情報は、ご連絡の目的にのみ使用します。詳しくは<a href="privacy.html">プライバシーポリシー</a>をご覧ください。
  </p>
</main>
</body>
</html>
