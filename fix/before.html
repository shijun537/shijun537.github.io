<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>修正前｜表示崩れの例</title>
<style>
  :root {
    --ink: #1a1a1a;
    --muted: #6b6b6b;
    --line: #e6e6e6;
    --accent: #1a6b4f;
    --soft: #eef5f1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.8;
  }
  .banner {
    background: #7a2e2e;
    color: #fff;
    font-size: 13px;
    text-align: center;
    padding: 8px 12px;
  }
  .banner a { color: #fff; }

  /* ここから下が「崩れている」部分 */
  .wrap { width: 1100px; margin: 0 auto; }

  header { border-bottom: 1px solid var(--line); }
  .nav { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; }
  .nav a { font-size: 10px; padding: 0; color: var(--accent); margin-left: 8px; }

  .hero { position: relative; height: 300px; background: linear-gradient(120deg, #dff0e7, #c9e4d6); }
  .hero h1 { position: absolute; left: -30px; top: 70px; font-size: 34px; margin: 0; width: 520px; }
  .hero .card {
    position: absolute;
    top: 30px;
    left: 380px;
    width: 460px;
    background: #fff;
    padding: 16px;
  }

  .cols { display: flex; gap: 0; margin-top: 24px; }
  .col { width: 420px; padding: 0 8px; }
  .col h2 { font-size: 20px; margin: 0 0 4px; }

  .contact { margin-top: 24px; }
  .contact a { font-size: 11px; padding: 2px; color: #fff; background: var(--accent); }
</style>
</head>
<body>
<div class="banner">修正前（スマホで崩れる例） ｜ <a href="after.html">修正後を見る</a></div>

<div class="wrap">
  <header>
    <div class="nav">
      <strong>みどり電機 サービス紹介</strong>
      <nav>
        <a href="#">サービス</a>
        <a href="#">料金</a>
        <a href="#">会社概要</a>
        <a href="#">お問い合わせ</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <h1>小さな工場のための、電気設備メンテナンス</h1>
    <div class="card">
      <p>点検から部品交換まで、1社でまとめて対応します。まずはお気軽にご相談ください。</p>
    </div>
  </section>

  <section class="cols">
    <div class="col">
      <h2>定期点検</h2>
      <p>年2回の点検で、突発停止を減らします。</p>
    </div>
    <div class="col">
      <h2>緊急対応</h2>
      <p>平日は当日中に駆けつけます。</p>
    </div>
    <div class="col">
      <h2>部品交換</h2>
      <p>在庫のある部品は即日交換できます。</p>
    </div>
  </section>

  <section class="contact">
    <p>お問い合わせ：<a href="#">こちらから</a></p>
  </section>
</div>
</body>
</html>
