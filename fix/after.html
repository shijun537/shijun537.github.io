<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>修正後｜表示崩れの修正例</title>
<style>
  :root {
    --ink: #1a1a1a;
    --muted: #6b6b6b;
    --line: #e6e6e6;
    --accent: #1a6b4f;
    --soft: #eef5f1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.8;
  }
  .banner {
    background: var(--accent);
    color: #fff;
    font-size: 13px;
    text-align: center;
    padding: 8px 12px;
  }
  .banner a { color: #fff; display: inline-block; padding: 10px 6px; }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

  header { border-bottom: 1px solid var(--line); }
  .nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 8px 0;
  }
  .nav nav { display: flex; flex-wrap: wrap; gap: 8px; }
  .nav a {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding: 0 10px;
    font-size: 14px;
    color: var(--accent);
    text-decoration: none;
  }
  .nav a:hover { text-decoration: underline; }

  .hero {
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 32px;
    align-items: center;
    background: linear-gradient(120deg, #dff0e7, #c9e4d6);
    padding: 40px 24px;
    margin-top: 16px;
    border-radius: 8px;
  }
  .hero h1 {
    margin: 0;
    font-size: clamp(22px, 4.4vw, 34px);
    line-height: 1.4;
    letter-spacing: 0.01em;
  }
  .hero .card {
    background: #fff;
    padding: 20px;
    border-radius: 6px;
  }
  .hero .card p { margin: 0; }

  .cols {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 24px;
    margin-top: 32px;
  }
  .col { padding: 0; }
  .col h2 { font-size: 20px; margin: 0 0 4px; }
  .col p { margin: 0; color: var(--muted); }

  .contact { margin: 40px 0 56px; }
  .contact a {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding: 0 20px;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
  }
  .contact a:hover { opacity: 0.9; }

  @media (max-width: 720px) {
    .hero { grid-template-columns: 1fr; padding: 28px 20px; }
  }
</style>
</head>
<body>
<div class="banner">Shijun Studioの自主制作デモです。掲載の事業者・サービスは架空です。<br>修正後（スマホでも崩れない） ｜ <a href="before.html">修正前を見る</a></div>

<div class="wrap">
  <header>
    <div class="nav">
      <strong>みどり電機 サービス紹介</strong>
      <nav>
        <a href="#services">サービス</a>
        <a href="#contact">お問い合わせ</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <h1>小さな工場のための、電気設備メンテナンス</h1>
    <div class="card">
      <p>点検から部品交換まで、1社でまとめて対応します。まずはお気軽にご相談ください。</p>
    </div>
  </section>

  <section class="cols" id="services">
    <div class="col">
      <h2>定期点検</h2>
      <p>年2回の点検で、突発停止を減らします。</p>
    </div>
    <div class="col">
      <h2>緊急対応</h2>
      <p>平日は当日中に駆けつけます。</p>
    </div>
    <div class="col">
      <h2>部品交換</h2>
      <p>在庫のある部品は即日交換できます。</p>
    </div>
  </section>

  <section class="contact" id="contact">
    <p><a href="../">Shijun Studioの制作案内へ</a></p>
  </section>
</div>
</body>
</html>
